name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-mode/backend
    services:
      # The Guide Engine relies on SELECT ... FOR UPDATE to serialize a single
      # owner's mutations. SQLite ignores it, so the suite also runs here.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: guider
          POSTGRES_PASSWORD: guider
          POSTGRES_DB: guider_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: user-mode/backend/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check app tests scripts migrations

      - name: Unit tests
        run: uv run pytest -q

      - name: Unit tests on PostgreSQL
        env:
          GUIDE_TEST_DATABASE_URL: postgresql+asyncpg://guider:guider@localhost:5432/guider_test
        run: uv run pytest -q

      - name: Apply migrations
        run: |
          mkdir -p .local
          uv run alembic upgrade head

      - name: Migrations match models
        run: uv run alembic check

      - name: Generated contracts are current
        run: |
          uv run python -m scripts.export_contract
          git diff --exit-code -- ../contracts \
            || { echo "::error::user-mode/contracts is stale. Run 'uv run python -m scripts.export_contract' and commit the result."; exit 1; }

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-mode/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: user-mode/web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
