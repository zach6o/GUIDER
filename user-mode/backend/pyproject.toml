[project]
name = "guider-backend"
version = "0.1.0"
description = "Guider screenshot help API — development slice"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1", "asyncpg>=0.30,<1", "aiosqlite>=0.21,<1",
  "alembic>=1.15,<2", "pyjwt[crypto]>=2.10,<3", "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1", "pillow>=11.2,<13",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
